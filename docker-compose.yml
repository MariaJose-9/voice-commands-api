services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: voice_command_api
      MYSQL_USER: voice_user
      MYSQL_PASSWORD: voice_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements-docker.txt
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://voice_user:voice_password@mysql:3306/voice_command_api?charset=utf8mb4
      ENV: development
      ALLOWED_ORIGINS: "*"
      API_AUTH_TOKEN: "UU75xrlDeV6up7wyYdOMxhhMsUTP03G6WJaGdh5aQcMOo70p8ykKDLDxOpRy5MjE"
      ENABLE_SEMANTIC_MATCHER: "false"
      FUZZY_THRESHOLD: "88"
      ENABLE_OLLAMA_FALLBACK: "true"
      LLM_COMMAND_MODE: hybrid
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_TIMEOUT_SECONDS: "8"
      ALLOW_DYNAMIC_SIZE_INCHES: "true"
      MIN_SIZE_INCHES: "40"
      MAX_SIZE_INCHES: "150"
      ENABLE_AUDIO_TRANSCRIPTION: "true"
      TRANSCRIPTION_ENGINE: faster_whisper
      TRANSCRIPTION_MODEL_NAME: tiny
      TRANSCRIPTION_DEVICE: cpu
      TRANSCRIPTION_COMPUTE_TYPE: int8
      TRANSCRIPTION_BEAM_SIZE: "1"
      MAX_AUDIO_FILE_MB: "10"
      MAX_AUDIO_DURATION_SECONDS: "30"
      ALLOWED_AUDIO_EXTENSIONS: .ogg,.mp3,.m4a,.mp4,.wav,.webm,.aac,.flac
      ALLOWED_AUDIO_MIME_TYPES: audio/ogg,audio/mpeg,audio/mp3,audio/mp4,audio/x-m4a,audio/wav,audio/x-wav,audio/webm,audio/aac,audio/flac,video/mp4,video/webm,application/octet-stream
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - audio_tmp:/tmp/voice-command-audio
    command: >
      sh -c "alembic upgrade head &&
      python -m app.db.seed &&
      python -m app.db.publish_initial_catalog &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  ollama:
    image: ollama/ollama
    profiles:
      - ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mysql_data:
  hf_cache:
  audio_tmp:
  ollama_data:
