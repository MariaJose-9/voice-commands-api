<article class="stat-card">
  <span class="stat-label">Total Commands</span>
  <strong class="stat-value">{{ dashboard.total_commands }}</strong>
</article>
<article class="stat-card">
  <span class="stat-label">Total Examples</span>
  <strong class="stat-value">{{ dashboard.total_examples }}</strong>
</article>
<article class="stat-card">
  <span class="stat-label">Total Entities</span>
  <strong class="stat-value">{{ dashboard.total_entities }}</strong>
</article>
<article class="stat-card">
  <span class="stat-label">Pending Logs</span>
  <strong class="stat-value">{{ dashboard.pending_logs }}</strong>
</article>
<article class="stat-card">
  <span class="stat-label">Active Version</span>
  <strong class="stat-value">{{ dashboard.active_version or "none" }}</strong>
</article>
