{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<section class="panel panel-auth">
  <h2>Login</h2>
  <p class="muted">Use an active admin account to access the panel.</p>
  {% if error %}
  <div class="alert">{{ error }}</div>
  {% endif %}
  <form method="post" action="/admin/login" class="form-stack">
    <label>
      <span>Email</span>
      <input type="email" name="email" value="{{ email or '' }}" required>
    </label>
    <label>
      <span>Password</span>
      <input type="password" name="password" required>
    </label>
    <button class="button" type="submit">Sign In</button>
  </form>
</section>
{% endblock %}
